<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registracija</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 250px;
        }
        .auth-button {
            align-self: center;
            font-family: inherit;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">

        <main class="main-content">
            {% for poruka in get_flashed_messages() %}
                <p>{{ poruka }}</p>
            {% endfor %}

            <h2>Registracija</h2>

            <form class="auth-form" action="{{ url_for('register') }}" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="text" name="username" placeholder="Korisničko ime">
                <input type="password" name="password" placeholder="Lozinka">

                <button class="auth-button" type="submit">Registriraj se</button>
            </form>

            <p>Imaš račun? <a href="{{ url_for('login') }}">Prijavi se</a></p>
        </main>
    </div>



</body>
</html>
